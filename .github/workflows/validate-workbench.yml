name: Validate local workbench
on:
  push:
    paths:
      - 'workbench/**'
      - '.github/workflows/validate-workbench.yml'
  pull_request:
    paths:
      - 'workbench/**'
      - '.github/workflows/validate-workbench.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  local-workbench:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: workbench/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm test
