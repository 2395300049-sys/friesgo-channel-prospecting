name: Validate research inputs and releases
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/current_model.py
      - run: python scripts/validate_release.py
      - run: python scripts/reproduce.py
      - run: python -m unittest discover -s tests -v
